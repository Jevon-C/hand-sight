[package]
name = "axonhand-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hand Sight web server: serves the app and the JSON API."

[dependencies]
axonhand-api = { path = "../api" }
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-stream = "0.1.19"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1.9.0"
tempfile = "3"

[lints]
workspace = true
