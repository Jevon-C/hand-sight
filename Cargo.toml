[workspace]
resolver = "2"
members = ["crates/geom", "crates/geom-py", "crates/hand", "crates/track", "crates/api", "crates/server", "crates/ui"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
